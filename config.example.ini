; Copie para config.ini e preencha. config.ini NÃO vai para o Git.
; No servidor, pode ficar em outro lugar: defina TICKET_MANAGER_CONFIG=/etc/ticket-manager/config.ini

[banco]
; PostgreSQL:  postgresql+psycopg://USUARIO:SENHA@localhost:5432/ticket_manager
; (caracteres especiais na senha precisam ser codificados: @ -> %40, : -> %3A, / -> %2F)
url = postgresql+psycopg://ticket:SENHA@localhost:5432/ticket_manager

[servidor]
; Chave que assina os cookies de sessão. Gere com:
;   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
secret_key =

; Pasta onde os anexos são gravados (o usuário do serviço precisa poder escrever nela)
anexos_pasta = /var/lib/ticket-manager/anexos
anexo_max_mb = 10

; Horas até a sessão expirar
sessao_horas = 10

; true = qualquer pessoa pode criar conta na tela de login
cadastro_aberto = true

; Com Nginx na frente: atras_de_proxy = true.  Com HTTPS ativo: cookie_seguro = true
atras_de_proxy = true
cookie_seguro = false
