; Copie para config.ini e preencha. config.ini NÃO vai para o Git.
; No servidor, pode ficar em outro lugar: defina TICKET_MANAGER_CONFIG=/etc/ticket-manager/config.ini

[banco]
; PostgreSQL:  postgresql+psycopg://USUARIO:SENHA@localhost:5432/ticket_manager
; (caracteres especiais na senha precisam ser codificados: @ -> %40, : -> %3A, / -> %2F)
url = postgresql+psycopg://ticket:SENHA@localhost:5432/ticket_manager

[servidor]
; Chave que assina os cookies de sessão. Gere com:
;   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
secret_key =

; Pasta onde os anexos são gravados (o usuário do serviço precisa poder escrever nela)
anexos_pasta = /var/lib/ticket-manager/anexos
anexo_max_mb = 10

; Horas até a sessão expirar
sessao_horas = 10

; true = qualquer pessoa pode criar conta na tela de login
cadastro_aberto = true

; Com Nginx na frente: atras_de_proxy = true.  Com HTTPS ativo: cookie_seguro = true
atras_de_proxy = true
cookie_seguro = false

[email]
; Avisos por e-mail (chamado novo, encaminhado, respostas, encerrado).
; Deixe host em branco para o sistema funcionar sem enviar e-mails.
; Teste com:  python manage.py testar-email seu@email.com.br
;
;
; Servidor de e-mail interno da empresa (pergunte ao responsável pelo servidor):
;   - envio sem senha pela rede interna (relay):  porta = 25   seguranca = nenhuma   usuario/senha em branco
;   - envio com senha:                            porta = 587  seguranca = starttls  (ou 465 com ssl)
;   - se o servidor usa certificado próprio, informe o certificado da empresa em ca_arquivo
;
; Configurações comuns:
;   Microsoft 365 / Outlook:  host = smtp.office365.com   porta = 587  seguranca = starttls
;   Google Workspace / Gmail: host = smtp.gmail.com       porta = 587  seguranca = starttls  (use "senha de app")
;   Locaweb:                  host = email-ssl.com.br     porta = 465  seguranca = ssl
;   HostGator / cPanel:       host = mail.SEUDOMINIO      porta = 465  seguranca = ssl
host =
porta = 587
seguranca = starttls
usuario = chamados@suaempresa.com.br
senha =
remetente = chamados@suaempresa.com.br
nome = Ticket Manager

; Endereço do sistema usado nos links dos e-mails (ex.: http://192.168.0.50 ou http://chamados.local)
; Em branco, usa o endereço pelo qual a pessoa acessou.
url_site =

; Servidor com certificado próprio (autoassinado ou da empresa):
;   ca_arquivo = /etc/ticket-manager/certificado-email.crt   (jeito seguro: confia só nesse certificado)
;   verificar_certificado = false                            (último caso: aceita qualquer certificado)
ca_arquivo =
verificar_certificado = true
