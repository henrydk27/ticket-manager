{% extends "base.html" %}
{% block titulo %}Minha conta{% endblock %}
{% block conteudo %}
<div class="cabecalho">
  <h1>Minha conta</h1>
  <a class="botao" href="{{ url_for('conta.senha') }}">Trocar senha</a>
</div>

<form class="cartao formulario formulario-estreito" method="post" action="{{ url_for('conta.perfil') }}">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <dl class="dados">
    <dt>Usuário</dt><dd>{{ usuario.login }}</dd>
    <dt>Perfil</dt><dd>{{ usuario.papel_nome }}</dd>
    <dt>Conta criada</dt><dd>{{ usuario.criado_em|data }}</dd>
  </dl>

  <label for="nome">Nome completo</label>
  <input id="nome" name="nome" value="{{ usuario.nome }}" maxlength="100" required>

  <label for="email">E-mail <span class="suave">(opcional)</span></label>
  <input id="email" name="email" type="email" value="{{ usuario.email or '' }}" maxlength="150">

  <label for="setor">Setor</label>
  <select id="setor" name="setor" required>
    {% for s in SETORES %}<option {{ 'selected' if usuario.setor == s }}>{{ s }}</option>{% endfor %}
  </select>

  <div class="acoes">
    <button class="botao botao-primario" type="submit">Salvar</button>
  </div>
</form>
{% endblock %}
