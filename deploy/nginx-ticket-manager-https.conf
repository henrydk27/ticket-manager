# /etc/nginx/sites-available/ticket-manager  (versão com HTTPS; ver deploy/HTTPS-INTERNO.md)
#
# Certificado emitido pela autoridade certificadora interna (OPNsense) para ticket.internal.
# Os computadores confiam nele depois de instalar o certificado da CA (deploy/certificado/).

# HTTP: só redireciona para o endereço com HTTPS (inclusive quem digitar o IP)
server {
    listen 80;
    server_name ticket.internal _;
    return 301 https://ticket.internal$request_uri;
}

server {
    listen 443 ssl;
    server_name ticket.internal _;

    ssl_certificate     /etc/ssl/ticket-manager/ticket.internal.crt;
    ssl_certificate_key /etc/ssl/ticket-manager/ticket.internal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 5 anexos de até 10 MB por envio + folga
    client_max_body_size 60m;

    # Arquivos estáticos direto pelo Nginx
    location /static/ {
        alias /opt/ticket-manager/app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
