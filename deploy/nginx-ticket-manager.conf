# /etc/nginx/sites-available/ticket-manager
server {
    listen 80;
    server_name _;   # troque pelo nome ou IP do servidor, ex.: chamados.empresa.local

    # 5 anexos de até 10 MB por envio + folga
    client_max_body_size 60m;

    # Arquivos estáticos direto pelo Nginx
    location /static/ {
        alias /opt/ticket-manager/app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
